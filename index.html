
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Shop Billing System</h1>
        <p>Simple Shop Management App</p>

        <h2>Add Product</h2>

        <input type="text" id="name" placeholder="Product Name">
        <input type="number" id="qty" placeholder="Quantity" min="1">
        <input type="number" id="price" placeholder="Price per item" min="0" step="0.01">

        <button onclick="addProduct()">Add Product</button>

        <h2>Product List</h2>

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="productList"></tbody>
        </table>

        <h2 id="grandTotal">Grand Total: ₹0.00</h2>
        <button onclick="window.print()">Print Bill</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
